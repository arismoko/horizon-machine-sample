name: Sample checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    env:
      # Matches the pinned Horizon launcher's native-build toolchain.
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      # The crate names the API by the SDK path; no sdk-<build id> release exists for the pin, so the
      # API source comes from a checkout of the pinned Horizon commit.
      - name: Write the pinned API source to .horizon/sdk/api
        run: |
          rev=$(python3 -c "import tomllib; print(tomllib.load(open('horizon-mod.toml','rb'))['native']['horizon'])")
          git clone --no-checkout https://github.com/arismoko/horizon "$RUNNER_TEMP/horizon"
          git -C "$RUNNER_TEMP/horizon" fetch origin "$rev"
          git -C "$RUNNER_TEMP/horizon" checkout --detach "$rev"
          python3 "$RUNNER_TEMP/horizon/tools/sdk_api_source.py" build .horizon/sdk/api
      - run: cargo fetch --locked
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - run: cargo test --workspace --locked --offline
