id = "machine_sample"
name = "Machine Sample"
version = "0.1.0"
description = "Original content for the native machine sample"
authors = []
api = "0.2"
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "13e3b39f7fe0cfeedc85a7aefb30a0e5e270b539"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.mixin]]
id = "tick_pass"
target = "horizon_client::game::block_entity_ticks::Game<'_>::tick_block_entities"
kind = "HEAD"
helper = "src/native/entry.rs"

[[native.loop]]
id = "machines"
loop = "block_entities.tick"
helper = "src/native/count.rs"
with = "Machines"

[[native.module]]
id = "telemetry"
file = "crates/horizon-client/src/game/world/autosave.rs"
name = "sample_telemetry"
source = "src/native/telemetry.rs"

[[native.bridge]]
id = "autosave"
kind = "GET_MUT"
target = "horizon_client::game::Game"
member = "ticks_until_autosave"

[[native.mixin]]
id = "autosave_notice"
target = "horizon_client::game::autosave::Game<'_>::on_tick_rate_changed"
kind = "HEAD"
helper = "src/native/autosave.rs"
bindings = [{ name = "game", ty = "&mut Game<'_>", value = "&mut *self" }]
